name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build fetches market data only when the file is absent. A checked-in
      # snapshot keeps CI off the upstream host, so its outages fail the deploy,
      # which keeps the last good site up, and never the tests.
      - run: cp tests/fixtures/market-data.json public/market-data.json
      - run: pnpm run test:all
      - run: pnpm audit --prod --audit-level=high

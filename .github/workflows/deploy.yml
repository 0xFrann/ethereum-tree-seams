# Builds the static export and publishes it to GitHub Pages. The schedule is
# what keeps the market history current: each run fetches the upstream CSV
# again, and a failed fetch fails the build, which leaves the previously
# published site in place.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run data
      # The CV is read out of its own private repository; CV_TOKEN is a
      # fine-grained token that can read that repository's contents and no more.
      - run: pnpm run cv
        env:
          CV_TOKEN: ${{ secrets.CV_TOKEN }}
      # A project site lives under /<repository>; set BASE_PATH to an empty
      # string here for a custom domain or a user site.
      - run: |
          echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
